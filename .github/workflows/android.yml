name: Android app

on:
  push:
    branches: [ "main" ]
    paths: [ "android/**", ".github/workflows/android.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK and App Bundle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: radon-academy-app
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Also attach the unsigned build to a temporary pre-release, so it can be fetched and
      # signed outside GitHub (the signing key is not stored in this repository).
      - name: Attach unsigned build to a temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-unsigned-${{ github.run_number }}"
          gh release create "$tag" --prerelease --target "${{ github.sha }}" \
            --title "Android build ${{ github.run_number }} (unsigned)" \
            --notes "Unsigned build for signing. Not installable as is." \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/bundle/release/app-release.aab
