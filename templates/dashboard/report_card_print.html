<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if cards|length == 1 %}Report card: {{ cards.0.student.get_full_name|default:cards.0.student.username }}{% else %}Report cards: {{ section.class_group.name }} – {{ section.name }}{% endif %}{% if period %}, {{ period.label }}{% endif %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        @page { size: A4; margin: 12mm; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #eef1f5; color: #0f172a; font-size: 12px; line-height: 1.4; }

        .toolbar { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0.75rem 1rem;
                   display: flex; gap: 0.75rem; align-items: center; justify-content: center; flex-wrap: wrap; }
        .toolbar span { color: #475569; font-size: 0.85rem; }
        .toolbar button { font: inherit; font-size: 0.85rem; font-weight: 600; border: 0; border-radius: 8px; padding: 0.55rem 1.2rem; cursor: pointer; }
        .toolbar .primary { background: #4f46e5; color: #fff; }
        .toolbar .plain { background: #e2e8f0; color: #0f172a; }

        .rc { background: #fff; width: 210mm; max-width: 100%; min-height: 270mm; margin: 1.25rem auto; padding: 14mm 13mm 12mm;
              box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08); display: flex; flex-direction: column; }
        .rc-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem;
                   border-bottom: 3px solid #4f46e5; padding-bottom: 0.7rem; margin-bottom: 0.9rem; }
        .rc-head h1 { font-size: 20px; font-weight: 800; color: #312e81; letter-spacing: -0.02em; }
        .rc-head p { font-size: 13px; color: #475569; font-weight: 600; margin-top: 2px; }
        .rc-term { text-align: right; font-size: 11px; color: #475569; }

        .rc-info { display: grid; grid-template-columns: 2fr 1.5fr 1fr; gap: 0.75rem; margin-bottom: 0.9rem; }
        .rc-info dt { font-size: 10px; color: #64748b; font-weight: 600; }
        .rc-info dd { font-size: 13px; font-weight: 700; }

        .rc-summary { display: flex; border: 1px solid #c7d2fe; background: #f5f7ff; border-radius: 8px; margin-bottom: 0.75rem; }
        .rc-summary > div { flex: 1; padding: 0.6rem 0.9rem; border-left: 1px solid #c7d2fe; }
        .rc-summary > div:first-child { border-left: 0; }
        .rc-k { font-size: 10px; color: #475569; font-weight: 600; }
        .rc-v { font-size: 20px; font-weight: 800; color: #312e81; letter-spacing: -0.02em; }
        .rc-s { font-size: 10.5px; color: #475569; }
        .rc-grade { display: inline-block; font-size: 13px; background: #312e81; color: #fff; border-radius: 4px; padding: 0 6px; vertical-align: 3px; margin-left: 2px; }

        .rc-note { font-size: 10.5px; color: #92400e; margin-bottom: 0.6rem; }
        .rc-empty { color: #64748b; padding: 1rem 0; }

        .rc-table { width: 100%; border-collapse: collapse; margin-bottom: 0.9rem; }
        .rc-table th { background: #1e1b4b; color: #fff; font-size: 10px; font-weight: 600; text-align: left; padding: 6px 7px; }
        .rc-table td { border-bottom: 1px solid #e2e8f0; padding: 6px 7px; vertical-align: top; }
        .rc-table tbody tr:nth-child(even) td { background: #f8fafc; }
        .rc-table .num { text-align: right; white-space: nowrap; }
        .rc-table .subj { font-weight: 700; }
        .rc-table .score { font-weight: 700; font-size: 12.5px; }
        .rc-table .comment { font-style: italic; color: #334155; max-width: 52mm; }
        .rc-table .comment strong { font-style: normal; }
        .small { font-size: 10px; }
        .muted { color: #64748b; font-weight: 500; }
        .prov { display: block; font-size: 9px; font-weight: 700; color: #92400e; }

        .rc-remarks { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin-bottom: 0.8rem; }
        .rc-remarks > div { border: 1px solid #e2e8f0; border-radius: 8px; padding: 0.6rem 0.75rem; min-height: 26mm; }
        .rc-remarks h2 { font-size: 11px; font-weight: 700; color: #312e81; margin-bottom: 0.3rem; }
        .rc-remarks p { font-size: 11.5px; }
        .lines { height: 15mm; background: repeating-linear-gradient(transparent, transparent 7mm, #cbd5e1 7mm, #cbd5e1 calc(7mm + 1px)); }

        .rc-scale { font-size: 10px; color: #475569; display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; margin-bottom: 0.6rem; }
        .rc-sign { margin-top: auto; padding-top: 14mm; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
        .rc-sign div { border-top: 1px solid #64748b; padding-top: 4px; text-align: center; font-size: 10.5px; color: #475569; }

        @media print {
            body { background: #fff; }
            .toolbar { display: none; }
            .rc { margin: 0; width: auto; min-height: 268mm; box-shadow: none; padding: 0; break-after: page; }
            .rc:last-of-type { break-after: auto; }
            .rc-table tr { break-inside: avoid; }
            .rc-summary, .rc-table th, .rc-table tbody tr:nth-child(even) td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .rc-table th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
        @media (max-width: 640px) {
            .rc { padding: 1rem; min-height: 0; }
            .rc-info, .rc-remarks { grid-template-columns: 1fr; }
            .rc-summary { flex-direction: column; }
            .rc-summary > div { border-left: 0; border-top: 1px solid #c7d2fe; }
            .rc-summary > div:first-child { border-top: 0; }
            .rc-table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        {% if cards|length > 1 %}<span>{{ cards|length }} report cards, one per page</span>{% endif %}
        <button class="primary" onclick="window.print()">Print or save as PDF</button>
        <button class="plain" onclick="window.close()">Close</button>
    </div>
    {% for c in cards %}
        {% include "dashboard/_report_card.html" %}
    {% empty %}
    <p style="text-align:center;padding:3rem;color:#64748b;">There are no students in this section.</p>
    {% endfor %}
</body>
</html>
